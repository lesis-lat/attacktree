name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # weekly, so new CodeQL queries also run over code that has not changed
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # the app's TypeScript, and the workflows themselves (injection, excessive permissions)
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # interpreted languages: CodeQL reads the source, no build needed
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - dist
              - coverage

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
